version: '3.8'

services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: codebility
      POSTGRES_PASSWORD: abcd1234
      POSTGRES_DB: codebility_db
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codebility"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: